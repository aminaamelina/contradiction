<style> .bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}
</style>


<a href="end.html"><video autoplay muted loop class="bg-video">
  <source src="amerivideo.mp4" type="video/mp4">
</video>
<div id="fade"></div>
<script>
function goToPage(url) {
  const fade = document.getElementById("fade");
  fade.classList.add("active");

  setTimeout(() => {
    window.location.href = url;
  }, 500);
}
</script>
</body>
