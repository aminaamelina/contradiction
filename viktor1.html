<!DOCTYPE html>
<html>
<head>
<title>choice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh; /* вместо min-height */
  overflow: hidden; /* убирает прокрутку */
  background-image: url("viktor3.png");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
}

 .row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 200px;
      margin-top: 70px;
    }


h1, h2 {
  text-align: right; /* теперь влево */
  margin: 0;
  font-size: 40px;
}



.vertical-align {
  position: absolute;
  top: 60%;   /* ниже */
  right: 5%;   /* отступ слева */
  transform: translateY(-50%);
}

@media (max-width: 600px) {
  .row {
    flex-direction: column;
    align-items: center;
  }
}



.dialogue-box {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  width: 80%;
  max-width: 1000px;
  background: rgba(10, 15, 30, 0.9);
  border: 4px solid white;
  border-radius: 18px;
  padding: 25px 30px;
  color: white;
  font-family: Georgia, serif;
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
}

.speaker-name {
  position: absolute;
  top: -35px;
  left: 25px;
  background: white;
  color: #1b1b1b;
  padding: 8px 20px;
  border-radius: 12px 12px 0 0;
  font-weight: bold;
  font-size: 22px;
}

.dialogue-box p {
  font-size: 28px;
  line-height: 1.4;
  margin: 0 0 15px;
}

.dialogue-box button {
  float: right;
  background: #6b35d8;
  color: white;
  border: none;
  padding: 10px 22px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
}

.dialogue-box button:hover {
  background: #8b5cff;
}



</style>



</head>
<body>


<div class="dialogue-box">
  <div class="speaker-name">James</div>
  <p id="dialogue-text">Let's watch some TV.</p>
  <a href="viktor2.html"><button onclick="nextDialogue()">Next</button>
</div>

<div id="fade"></div>


<script>
  const dialogues = [
    {
      name: "James",
      text: "Let's watch some TV. There should be something interesting on it."
    }
  ];

  let index = 0;

  function nextDialogue() {
    index++;

    if (index >= dialogues.length) {
      document.querySelector(".dialogue-box").style.display = "none";
      return;
    }

    document.querySelector(".speaker-name").textContent = dialogues[index].name;
    document.getElementById("dialogue-text").textContent = dialogues[index].text;
  }
</script>



</body>
</html>
